<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>Cost of Living — channel intro</title>
  <script src="gsap.min.js"></script>
  <style>
    @font-face { font-family: "Montserrat"; src: url("fonts/Montserrat-Black.ttf"); font-weight: 900; }
    @font-face { font-family: "Montserrat"; src: url("fonts/Montserrat-ExtraBold.ttf"); font-weight: 800; }
    @font-face { font-family: "Montserrat"; src: url("fonts/Montserrat-Bold.ttf"); font-weight: 700; }
    body { margin: 0; background: #060a15; }
    #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #060a15; font-family: "Montserrat", sans-serif; color: #fff; }
    .clip { position: absolute; inset: 0; }
    .grid { position: absolute; inset: -200px; background-image: linear-gradient(rgba(43,227,139,0.10) 2px, transparent 2px), linear-gradient(90deg, rgba(43,227,139,0.10) 2px, transparent 2px); background-size: 120px 120px; }
    .glow { position: absolute; left: 140px; top: 560px; width: 800px; height: 800px; border-radius: 50%; background: radial-gradient(circle, rgba(43,227,139,0.35), rgba(43,227,139,0) 65%); }
    .ticker { position: absolute; left: 0; top: 1560px; width: 3600px; display: flex; gap: 56px; font-weight: 900; font-size: 64px; white-space: nowrap; }
    .ticker span { color: rgba(255,255,255,0.62); }
    .ticker span.hot { color: #2be38b; }
    .pre { position: absolute; left: 0; width: 1080px; text-align: center; font-weight: 800; letter-spacing: 6px; }
    .word { position: absolute; left: 0; width: 1080px; text-align: center; font-weight: 900; line-height: 1; }
    #w-cost { top: 600px; font-size: 260px; }
    #w-of { top: 860px; font-size: 120px; color: #2be38b; }
    #w-living { top: 990px; font-size: 230px; }
    #underline { position: absolute; left: 150px; top: 1240px; width: 780px; height: 14px; border-radius: 7px; background: #2be38b; box-shadow: 0 0 30px rgba(43,227,139,0.8); transform-origin: left center; }
    #ep { position: absolute; left: 0; width: 1080px; top: 1300px; display: flex; justify-content: center; }
    #ep div { padding: 18px 40px; border-radius: 999px; background: #fff; color: #0b1226; font-weight: 900; font-size: 52px; letter-spacing: 4px; }
    #flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="6">
    <audio id="sting" data-timeline-role="music" src="assets/sting.wav" data-start="0" data-duration="6" data-track-index="9" data-volume="1"></audio>

    <!-- background: drifting price grid + glow -->
    <section id="bg" class="clip">
      <div class="grid" id="grid"></div>
      <div class="glow" id="glow"></div>
    </section>

    <!-- bar 1 (riser): question + accelerating price ticker -->
    <section id="intro" class="clip">
      <div class="pre" id="pre1" style="top: 760px; font-size: 64px;">WHAT DOES IT</div>
      <div class="pre" id="pre2" style="top: 850px; font-size: 96px; color: #2be38b;">REALLY COST?</div>
    </section>
    <section id="tick" class="clip">
      <div class="ticker" id="ticker" data-layout-allow-overflow>
        <span>$2,457</span><span class="hot">$386</span><span>$85</span><span>$186</span><span class="hot">$131</span><span>$5.51</span><span>$20</span><span class="hot">$3,245</span>
        <span>$2,457</span><span class="hot">$386</span><span>$85</span><span>$186</span><span class="hot">$131</span><span>$5.51</span><span>$20</span><span class="hot">$3,245</span>
      </div>
    </section>

    <!-- the drop: one word per kick, then the lock-up -->
    <section id="title" class="clip">
      <div id="lockup" style="position:absolute; inset:0;">
        <div class="word" id="w-cost">COST</div>
        <div class="word" id="w-of">OF</div>
        <div class="word" id="w-living">LIVING</div>
        <div id="underline"></div>
        <div id="ep"><div id="ep-chip">EP. 01 · CHICAGO</div></div>
      </div>
    </section>
    <section id="fx" class="clip">
      <div id="flash"></div>
    </section>
  </div>
  <script>
    // Beat grid of assets/sting.wav (112 BPM, synthesised here — so this is ground truth).
    // `hyperframes beats` analysed the same file but fitted a 303-BPM grid (confidence: low);
    // its strongest peaks (3.25, 3.84, 5.42 s) sit 30–90 ms from these kicks, so it was used as a cross-check only.
    const BEAT = 60 / 112, DROP = 4 * BEAT;          // 2.143 s
    const K = (n) => DROP + n * BEAT;                // n-th kick after the drop
    const tl = gsap.timeline({ paused: true });

    // background drift (continuous, finite)
    tl.fromTo("#grid", { x: 0, y: 0 }, { x: -120, y: -240, duration: 6, ease: "none" }, 0);
    tl.fromTo("#glow", { scale: 0.6, opacity: 0.4 }, { scale: 1.15, opacity: 1, duration: DROP, ease: "power2.in" }, 0);

    // bar 1: question types in, ticker accelerates with the riser
    tl.fromTo("#pre1", { y: 40, opacity: 0, filter: "blur(10px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 0.2);
    tl.fromTo("#pre2", { y: 40, opacity: 0, filter: "blur(10px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 0.55);
    tl.to(["#pre1", "#pre2"], { opacity: 0, scale: 1.3, filter: "blur(14px)", duration: 0.25, ease: "power2.in" }, DROP - 0.25);
    tl.fromTo("#ticker", { x: 0 }, { x: -1800, duration: 6, ease: "power2.in" }, 0);
    tl.to("#ticker", { opacity: 0, duration: 0.3, ease: "power1.in" }, K(2.5));  // decorative: leaves before the EP chip lands

    // the drop: flash + one word per kick, each a slam with overshoot
    tl.fromTo("#flash", { opacity: 0.0 }, { opacity: 0.55, duration: 0.03 }, DROP);
    tl.to("#flash", { opacity: 0, duration: 0.25, ease: "power2.out" }, DROP + 0.03);
    [["#w-cost", 0], ["#w-of", 1], ["#w-living", 2]].forEach(([id, n]) => {
      tl.fromTo(id, { scale: 2.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.2, ease: "power4.out" }, K(n));
      tl.fromTo("#lockup", { y: 0 }, { y: 10, duration: 0.05, yoyo: true, repeat: 1, ease: "power1.inOut" }, K(n));
    });
    tl.fromTo("#underline", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, K(3));
    tl.fromTo("#ep-chip", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2.2)" }, K(4));
    // end hit: the whole lock-up pulses once, then holds (>= 0.6 s of stillness before the cut)
    tl.fromTo("#lockup", { scale: 1 }, { scale: 1.05, duration: 0.08, ease: "power2.out" }, K(6) - 0.05);
    tl.to("#lockup", { scale: 1, duration: 0.25, ease: "power2.out" }, K(6) + 0.03);
    tl.fromTo("#glow", { opacity: 1 }, { opacity: 0.6, duration: 0.6, ease: "power1.out" }, K(6));

    window.__timelines["main"] = tl;
  </script>
</body>
</html>
